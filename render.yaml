databases:
  - name: rakshapay-db
    databaseName: rakshapay
    user: raksha_user
    plan: free
    region: oregon

services:
  - type: web
    name: rakshapay-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: rakshapay-db
          property: connectionString
      - key: FRAUD_LOW_THRESHOLD
        value: "30"
      - key: FRAUD_HIGH_THRESHOLD
        value: "70"
      - key: HIGH_VALUE_THRESHOLD_RUPEES
        value: "50000.0"
      - key: VELOCITY_WINDOW_SECONDS
        value: "60"
      - key: VELOCITY_MAX_TX_COUNT
        value: "3"
