version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rakshapay-postgres
    restart: always
    environment:
      POSTGRES_USER: rakshapay
      POSTGRES_PASSWORD: rakshapay_secure_password_2026
      POSTGRES_DB: rakshapay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rakshapay-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://rakshapay:rakshapay_secure_password_2026@db:5432/rakshapay
      SECRET_KEY: rakshapay-super-secret-jwt-key-change-in-production-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rakshapay-ui
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
